[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archivum"
version = "0.1.0"
description = "Gestor privado de biblioteca cinematográfica"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "PySide6>=6.7,<7",
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
archivum = "archivum.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
